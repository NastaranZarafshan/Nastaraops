name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests and research integrity (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: test
      LLM_MODE: mock
      API_KEY: ci-local-placeholder-not-a-real-secret
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --disable-pip-version-check --timeout 120 --retries 4 -r requirements-test.txt
          python -m pip check

      - name: Compile Python sources
        run: python -m compileall -q app scripts tests

      - name: Verify published research and branding
        run: |
          python scripts/check_research.py
          python scripts/check_nastaraops_branding.py

      - name: Run isolated test suite
        run: python -m pytest -q tests
